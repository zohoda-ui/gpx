<!-- GPX Viewer for Tistory Start -->
<!-- 외부 라이브러리 로드 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gpxparser/dist/GPXParser.min.js"></script>

<style>
/* 화이트 테마 CSS 스타일 시작 */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap');

#gpx-app-container {
    font-family: 'Inter', sans-serif;
    background-color: #ffffff; /* 하얀색 배경 */
    color: #333333; /* 어두운 글씨 */
    line-height: 1.6;
    padding: 20px;
    border-radius: 16px;
    margin: 20px 0;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    border: 1px solid #e5e7eb;
}

#gpx-app-container * {
    box-sizing: border-box;
}

#gpx-app-container header {
    text-align: center;
    margin-bottom: 20px;
}

#gpx-app-container h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    color: #1e293b;
    margin: 0 0 8px 0;
}

.gpx-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}

.gpx-stat-card {
    background: #f8f9fa;
    border: 1px solid #e5e7eb;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.gpx-stat-value {
    display: block;
    font-size: 1.2rem;
    font-weight: 700;
    color: #3b82f6; /* 파란색 강조 */
}

.gpx-stat-label {
    font-size: 0.75rem;
    color: #6b7280;
}

#gpx-map {
    height: 400px;
    width: 100%;
    border-radius: 16px;
    margin-bottom: 20px;
    z-index: 1;
    border: 1px solid #e5e7eb;
}

.gpx-chart-container {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    padding: 15px;
    border-radius: 16px;
    position: relative;
    height: 250px;
}

.gpx-file-input-wrapper {
    text-align: center;
    margin-bottom: 20px;
}

#gpxFileInput {
    display: none;
}

.gpx-custom-file-upload {
    display: inline-block;
    padding: 10px 20px;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    font-weight: 600;
    border-radius: 30px;
    font-size: 0.9rem;
    transition: background 0.3s;
}

.gpx-custom-file-upload:hover {
    background: #2563eb;
}
/* CSS 스타일 끝 */
</style>

<div id="gpx-app-container">
    <header>
        <h1>GPX Path Tracker</h1>
        <p style="color: #6b7280; font-size: 0.9rem;">전문화된 아웃도어 활동 분석</p>
    </header>

    <div class="gpx-file-input-wrapper">
        <label for="gpxFileInput" class="gpx-custom-file-upload">
            내 PC에서 GPX 파일 선택하기
        </label>
        <input id="gpxFileInput" type="file" accept=".gpx" />
    </div>

    <div class="gpx-stats-grid">
        <div class="gpx-stat-card"><span class="gpx-stat-label">거리</span><span id="gpx-dist" class="gpx-stat-value">0.00 km</span></div>
        <div class="gpx-stat-card"><span class="gpx-stat-label">획득 고도</span><span id="gpx-gain" class="gpx-stat-value">0 m</span></div>
        <div class="gpx-stat-card"><span class="gpx-stat-label">최고 고도</span><span id="gpx-max-ele" class="gpx-stat-value">0 m</span></div>
        <div class="gpx-stat-card"><span class="gpx-stat-label">최저 고도</span><span id="gpx-min-ele" class="gpx-stat-value">0 m</span></div>
    </div>

    <div id="gpx-map"></div>
    <div class="gpx-chart-container">
        <canvas id="gpxElevationChart"></canvas>
    </div>
</div>

<script>
// JS 로직 시작
// =========================================================
// [티스토리 자동 로드 설정]
// 만약 특정 GPX 파일을 블로그 방문자에게 자동으로 보여주고 싶다면,
// 아래 따옴표 안에 티스토리에 첨부한 파일의 링크 주소를 넣으세요.
// 예: const TARGET_GPX_URL = 'https://blog.kakaocdn.net/dn/...';
// 파일 업로드 버튼만 쓰려면 빈칸('')으로 두시면 됩니다.
const TARGET_GPX_URL = '';
// =========================================================

let gpxMap, gpxChart, gpxElevationMarker;
const gpxAppParser = new gpxParser();

function initGpxMap() {
    gpxMap = L.map('gpx-map').setView([37.5665, 126.9780], 13);
    // 밝은 테마의 지도 (CartoDB Positron)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO'
    }).addTo(gpxMap);

    gpxElevationMarker = L.circleMarker([0, 0], {
        radius: 8,
        fillColor: '#3b82f6',
        color: '#fff',
        weight: 2,
        fillOpacity: 1
    }).addTo(gpxMap);
    gpxElevationMarker.setOpacity(0);
}

function processTistoryGPX(xml) {
    gpxAppParser.parse(xml);
    // 가장 최근에 파싱된 트랙을 가져오기 위해 배열의 마지막 요소를 선택합니다.
    const track = gpxAppParser.tracks[gpxAppParser.tracks.length - 1];
    if(!track) return alert('유효하지 않은 GPX 파일입니다.');
    
    const points = track.points.map(p => [p.lat, p.lon]);
    const elevations = track.points.map(p => p.ele);
    
    let dist = 0;
    const distances = [0];
    for (let i = 1; i < track.points.length; i++) {
        const p1 = L.latLng(track.points[i - 1].lat, track.points[i - 1].lon);
        const p2 = L.latLng(track.points[i].lat, track.points[i].lon);
        dist += p1.distanceTo(p2) / 1000;
        distances.push(parseFloat(dist.toFixed(2)));
    }

    const polyline = L.polyline(points, { color: '#3b82f6', weight: 5, opacity: 0.8 }).addTo(gpxMap);
    gpxMap.fitBounds(polyline.getBounds());
    
    L.marker(points[0]).addTo(gpxMap).bindPopup('Start');
    L.marker(points[points.length - 1]).addTo(gpxMap).bindPopup('End');

    const totalDist = distances[distances.length - 1].toFixed(2);
    const maxEle = Math.max(...elevations).toFixed(0);
    const minEle = Math.min(...elevations).toFixed(0);
    let gain = 0;
    for (let i = 1; i < elevations.length; i++) {
        const diff = elevations[i] - elevations[i - 1];
        if (diff > 0) gain += diff;
    }

    document.getElementById('gpx-dist').innerText = `${totalDist} km`;
    document.getElementById('gpx-gain').innerText = `${gain.toFixed(0)} m`;
    document.getElementById('gpx-max-ele').innerText = `${maxEle} m`;
    document.getElementById('gpx-min-ele').innerText = `${minEle} m`;

    const ctx = document.getElementById('gpxElevationChart').getContext('2d');
    if (gpxChart) gpxChart.destroy();

    const gradient = ctx.createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
    gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');

    gpxChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: distances,
            datasets: [{
                label: '고도(m)',
                data: elevations,
                borderColor: '#3b82f6',
                borderWidth: 2,
                fill: true,
                backgroundColor: gradient,
                tension: 0.4,
                pointRadius: 0,
                pointHitRadius: 20
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#6b7280' }, grid: { display: false } },
                y: { ticks: { color: '#6b7280' }, grid: { color: 'rgba(0, 0, 0, 0.05)' } }
            },
            onHover: (event, activeElements) => {
                if (activeElements.length > 0) {
                    gpxElevationMarker.setLatLng(points[activeElements[0].index]);
                    gpxElevationMarker.setOpacity(1);
                } else {
                    gpxElevationMarker.setOpacity(0);
                }
            }
        }
    });
}

document.addEventListener("DOMContentLoaded", () => {
    initGpxMap();
    
    // URL 자동 로드 로직
    if (TARGET_GPX_URL.trim() !== '') {
        fetch(TARGET_GPX_URL)
            .then(res => res.text())
            .then(xml => processTistoryGPX(xml))
            .catch(err => console.error("GPX 로드 실패:", err));
    }

    // 파일 입력 로직
    const fileInput = document.getElementById('gpxFileInput');
    if(fileInput) {
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { 
                processTistoryGPX(e.target.result); 
            };
            reader.readAsText(file);
        });
    }
});
// JS 로직 끝
</script>
<!-- GPX Viewer for Tistory End -->
