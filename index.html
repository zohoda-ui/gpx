<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Viewer</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff !important;
        }
        :root {
            --primary-color: #10b981;
            --primary-hover: #059669;
            --primary-light: rgba(16, 185, 129, 0.1);
            --bg-color: #ffffff;
            --muted-bg: #f9fafb;
            --text-color: #111827;
            --muted-text: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .gpx-viewer-wrapper {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            background: var(--card-bg);
            transition: all 0.3s ease;
            height: auto;
            max-height: fit-content;
        }
        .gpx-map {
            height: 380px;
            width: 100%;
            z-index: 1;
        }
        .gpx-chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            padding: 16px 20px 8px 20px;
            box-sizing: border-box;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }
        #gpx-elevation-chart {
            display: block;
        }
        @media (max-width: 768px) {
            .gpx-map {
                height: 260px;
            }
            .gpx-chart-container {
                height: 180px;
                padding: 12px 14px 4px 14px;
            }
        }
        .gpx-summary {
            display: flex;
            justify-content: space-around;
            padding: 14px 20px;
            background: var(--muted-bg);
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        .summary-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .summary-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted-text);
            font-weight: 600;
        }
        .summary-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
        }
        .summary-value.highlight-green {
            color: #10b981;
        }
        .summary-value.highlight-orange {
            color: #f59e0b;
        }
        .gpx-loading {
            padding: 40px;
            text-align: center;
            color: var(--muted-text);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="gpx-viewer-wrapper">
    <div id="gpx-loading" class="gpx-loading">GPX 경로 데이터를 불러오는 중...</div>
    <div id="gpx-map" class="gpx-map" style="display: none;"></div>
    <div id="gpx-chart-container" class="gpx-chart-container" style="display: none;">
        <canvas id="gpx-elevation-chart"></canvas>
    </div>
    <div id="gpx-summary" class="gpx-summary" style="display: none;">
        <div class="summary-item"><span class="summary-label">총 거리</span><span class="summary-value" id="summary-distance">-</span></div>
        <div class="summary-item"><span class="summary-label">누적 상승고도</span><span class="summary-value highlight-green" id="summary-ele-gain">-</span></div>
        <div class="summary-item"><span class="summary-label">최고 / 최저 고도</span><span class="summary-value" id="summary-ele-maxmin">-</span></div>
        <div class="summary-item"><span class="summary-label">v/km</span><span class="summary-value highlight-orange" id="summary-vkm">-</span></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- RunRuun Elevation Engine (Production Standard) -->
<script src="runruun-elevation.js"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const GPX_URL = urlParams.get('url');

    let gpxChartInstance = null;
    let mapInstance = null;
    let hoverMarkerInstance = null;
    let displayChartData = [];

    function renderAnalysis(result, rawPoints) {
        const stats = result.stats;
        const chartData = stats.chartData || [];

        // 1. 요약 정보 업데이트 (RunRuun Production 정규 통계 사용)
        const totalDist = typeof stats.totalDist === 'number' ? stats.totalDist : (stats.rawTotalDistKm || 0);
        const eleGain = typeof stats.eleGain === 'number' ? stats.eleGain : 0;
        const maxEle = typeof stats.maxEle === 'number' ? stats.maxEle : 0;
        const minEle = typeof stats.minEle === 'number' ? stats.minEle : 0;
        const vkm = typeof stats.vkm === 'number' ? stats.vkm : 0;

        document.getElementById('summary-distance').innerText = totalDist.toFixed(2) + ' km';
        document.getElementById('summary-ele-gain').innerText = Math.round(eleGain) + ' m';
        document.getElementById('summary-ele-maxmin').innerText = Math.round(maxEle) + ' m / ' + Math.round(minEle) + ' m';
        document.getElementById('summary-vkm').innerText = vkm.toFixed(1);

        // 2. 지도 좌표
        const path = (rawPoints && rawPoints.length > 0 ? rawPoints : (result.points || [])).map(pt => [pt.lat, pt.lon]);

        // 3. 차트 포인트 다운샘플링 (최대 800개)
        const MAX_CHART_POINTS = 800;
        if (chartData.length > MAX_CHART_POINTS) {
            const step = Math.ceil(chartData.length / MAX_CHART_POINTS);
            displayChartData = [];
            for (let i = 0; i < chartData.length; i += step) {
                displayChartData.push(chartData[i]);
            }
            const lastPt = chartData[chartData.length - 1];
            if (displayChartData[displayChartData.length - 1] !== lastPt) {
                displayChartData.push(lastPt);
            }
        } else {
            displayChartData = chartData.slice();
        }

        const dataPts = displayChartData.map(d => ({ x: parseFloat(d.x), y: parseFloat(d.y) }));

        const primaryColor = '#10b981';
        const textColor = '#6b7280';
        const gridColor = '#f3f4f6';

        const eleRange = maxEle - minEle;
        const eleBuffer = eleRange > 0 ? eleRange * 0.05 : 10;
        const yMin = Math.max(0, Math.floor(minEle - eleBuffer));
        const yMax = Math.ceil(maxEle + eleBuffer);

        const ctx = document.getElementById('gpx-elevation-chart').getContext('2d');

        if (gpxChartInstance) {
            gpxChartInstance.data.datasets[0].data = dataPts;
            gpxChartInstance.options.scales.y.min = yMin;
            gpxChartInstance.options.scales.y.max = yMax;
            gpxChartInstance.update();
        } else {
            gpxChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: '고도 (m)',
                        data: dataPts,
                        borderColor: primaryColor,
                        backgroundColor: 'rgba(16, 185, 129, 0.12)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: primaryColor,
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            bottom: 12,
                            top: 8,
                            left: 4,
                            right: 4
                        }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.95)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            titleFont: { size: 12, family: 'Inter', weight: 'normal' },
                            bodyFont: { size: 13, family: 'Inter', weight: 'bold' },
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                title: function(context) { return '거리: ' + context[0].parsed.x.toFixed(2) + ' km'; },
                                label: function(context) { return '고도: ' + context.parsed.y.toFixed(1) + ' m'; }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            display: true,
                            ticks: {
                                maxTicksLimit: 10,
                                color: textColor,
                                font: { family: 'Inter', size: 10 },
                                callback: function(value) { return value.toFixed(1) + ' km'; }
                            },
                            grid: { display: false }
                        },
                        y: {
                            display: true,
                            min: yMin,
                            max: yMax,
                            ticks: { 
                                color: textColor,
                                font: { family: 'Inter', size: 10 },
                                callback: function(value) { return value + ' m'; }
                            },
                            grid: { color: gridColor }
                        }
                    },
                    onHover: (e, activeElements) => {
                        if (activeElements.length > 0) {
                            const index = activeElements[0].index;
                            const point = displayChartData[index];
                            if (point && mapInstance && hoverMarkerInstance) {
                                if (!mapInstance.hasLayer(hoverMarkerInstance)) hoverMarkerInstance.addTo(mapInstance);
                                hoverMarkerInstance.setLatLng([point.lat, point.lon]);
                            }
                        } else {
                            if (mapInstance && hoverMarkerInstance && mapInstance.hasLayer(hoverMarkerInstance)) {
                                mapInstance.removeLayer(hoverMarkerInstance);
                            }
                        }
                    }
                }
            });
        }
        
        // 4. 지도 그리기
        if (!mapInstance) {
            document.getElementById('gpx-loading').style.display = 'none';
            document.getElementById('gpx-map').style.display = 'block';
            document.getElementById('gpx-chart-container').style.display = 'block';
            document.getElementById('gpx-summary').style.display = 'flex';

            mapInstance = L.map('gpx-map', { scrollWheelZoom: false });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(mapInstance);

            const polyline = L.polyline(path, { color: primaryColor, weight: 5, opacity: 0.85, lineJoin: 'round' }).addTo(mapInstance);
            
            setTimeout(() => {
                mapInstance.invalidateSize();
                mapInstance.fitBounds(polyline.getBounds());
            }, 200);

            hoverMarkerInstance = L.circleMarker([0,0], { radius: 6, fillColor: primaryColor, color: '#ffffff', weight: 2, opacity: 1, fillOpacity: 1 });

            if (gpxChartInstance) {
                setTimeout(() => { gpxChartInstance.resize(); }, 150);
            }
        }
    }

    async function initGpxViewer() {
        try {
            if (!GPX_URL) {
                 document.getElementById('gpx-loading').innerHTML = 'GPX URL이 제공되지 않았습니다.<br>iframe 주소 뒤에 <code>?url=깃허브Raw주소</code>를 추가해주세요.';
                 return;
            }

            const response = await fetch(GPX_URL);
            if (!response.ok) throw new Error('네트워크 응답이 정상이 아닙니다.');
            const gpxText = await response.text();

            if (typeof RunruunElevationEngine === 'undefined') {
                throw new Error('RunRuun 고도 엔진(RunruunElevationEngine)을 불러올 수 없습니다.');
            }

            const result = await RunruunElevationEngine.processGpx(gpxText, { profile: 'trail' });
            const rawParsed = RunruunElevationEngine.parseGpx(gpxText);

            renderAnalysis(result, rawParsed.points);

        } catch (error) {
            console.error('GPX 로딩 에러:', error);
            document.getElementById('gpx-loading').innerText = '데이터를 불러오는 데 실패했습니다. URL을 확인해주세요. (' + error.message + ')';
        }
    }

    initGpxViewer();
</script>
</body>
</html>
