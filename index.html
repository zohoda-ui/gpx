<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Pro Visualizer | Tistory Edition</title>
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gpxparser/dist/GPXParser.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>GPX Path Tracker</h1>
    </header>

    <div class="file-input-wrapper">
        <label for="fileInput" class="custom-file-upload">
            GPX 파일 업로드
        </label>
        <input id="fileInput" type="file" accept=".gpx" />
    </div>

    <div class="main-content">
        <div id="map"></div>
        <div class="chart-container">
            <!-- 차트 수직 커서 (CSS div) -->
            <div id="chart-crosshair"></div>
            <canvas id="elevationChart"></canvas>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">거리</span>
            <span id="dist" class="stat-value">0.00 km</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">획득 고도</span>
            <span id="gain" class="stat-value">0 m</span>
        </div>
    </div>
</div>

<!-- 지도 위 호버 툴팁 -->
<div id="map-tooltip" style="
    position:fixed;
    background:rgba(15,23,42,0.88);
    color:#fff;
    padding:8px 13px;
    border-radius:10px;
    font-size:0.82rem;
    font-family:Inter,sans-serif;
    pointer-events:none;
    display:none;
    z-index:9999;
    white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
    border:1px solid rgba(59,130,246,0.4);
    line-height:1.7;
"></div>

<!-- Core Logic -->
<script src="app.js"></script>

</body>
</html>
